<header class="site-header" data-header>
  <div class="container header__inner">
    <a class="brand" href="index.html" aria-label="{{s brand.name}}, torna alla pagina iniziale">
      <svg class="brand__mark" viewBox="0 0 24 28" width="20" height="24" aria-hidden="true" focusable="false">
        <path d="M2.5 27V12a9.5 9.5 0 0 1 19 0v15M7.5 27V12.6a4.5 4.5 0 0 1 9 0V27" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="brand__text">
        <span class="brand__name">{{s brand.name}}</span>
        <span class="brand__loc">Napoli · Collina del Vomero</span>
      </span>
    </a>

    <button class="burger" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
      <span data-nav-toggle-label>Menu</span>
      <span class="burger__bars" aria-hidden="true"><span></span><span></span></span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Navigazione principale" data-nav>
      <ul class="nav__list">
        {{nav_links}}
      </ul>
      <a class="btn btn--primary btn--sm header__cta" href="contatti.html#richiesta">Verifica disponibilità</a>

      <div class="nav__extra">
        <p class="nav__extra-title">Contatto diretto ({{s contact.response_time}})</p>
        <a class="nav__contact" href="{{href wa}}" target="_blank" rel="noopener">{{icon whatsapp}} <span>WhatsApp diretto</span></a>
        <a class="nav__contact" href="{{href tel}}">{{icon phone}} <span>{{s contact.phone_display}}</span></a>
        <a class="nav__contact" href="{{href mail}}">{{icon mail}} <span>{{s contact.email}}</span></a>
      </div>
    </nav>
  </div>
</header>
